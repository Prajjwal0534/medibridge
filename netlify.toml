[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/api/ai-chat"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/.netlify/functions/ai-chat"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
